# @package _global_

defaults:
  - _self_
  - data: Full_DataModule # choose datamodule with `test_dataloader()` for evaluation
  - model: ArcPalmModule
  - logger: wandb
  - trainer: gpu
  - paths: default
  - extras: default
  - hydra: default

task_name: "eval"

hydra:
  run:
    dir: ${paths.log_dir}/${task_name}/runs/Thesis_Eval_VisionTransformer_ArcFaceLoss_Canny

logger:
  wandb:
    name: "Thesis_Eval_VisionTransformer_ArcFaceLoss_Canny"
    tags: ${tags}
    group: "Vision Transformer"
  aim:
    experiment: "Vision Transformer"

# model: 
