#     weight_decay: 0.0005
#   num_classes: 1527


tags: ["eval", "thesis", "arcface", "iresnet50"]

# passing checkpoint path is necessary for evaluation
ckpt_path: /home/anhnt596/Palm-Recognition/logs/train/runs/Thesis_VisionTransformer_ArcFaceLoss_Canny/checkpoints/epoch_071.ckpt

model: 
  backbone: 
    _target_: src.models.backbone.ViT.SimpleViT
    image_height: 224
    image_width: 224
    patch_size: 7
    num_classes: 512
    dim: 512
    depth: 4
    heads: 8
    channels: 6
    mlp_dim: 1024
  loss: 'ArcFaceLoss'
  optimizer:
    lr: 0.01
  num_classes: 1527
