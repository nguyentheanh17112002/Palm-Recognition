# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: Full_DataModule
  - override /model: ArcPalmModule
  - override /callbacks: default
  - override /trainer: gpu

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["Full", "Resnet 50", "ROI"]

data:
  batch_size: 256
  num_workers: 2

trainer:
  min_epochs: 300
  max_epochs: 500
  devices: 1
logger:
  wandb:
    tags: ${tags}
    group: "Resnet 50"
  aim:
    experiment: "Full Resnet"

model: 
  backbone: 
    _target_: src.models.backbone.resnet.ResNet
    block: "Bottleneck"
    model: "resnet50"
    num_classes: 512
    num_channels: 3
  arcmargin: 
    _target_: src.models.backbone.ArcPalm.ArcMarginProduct
    in_features: 512
    out_features: 1581
    s: 30.0
    m: 0.50
    easy_margin: False
  optimizer:
    lr: 0.00001