# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: COEP_DataModule
  - override /model: ArcPalmModule
  - override /callbacks: default
  - override /trainer: gpu

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["COEP", "Kaggle", "ResNet50"]

logger:
  wandb:
    tags: ${tags}
    group: "COEP"
  aim:
    experiment: "COEP ViT"

model:
  backbone:
    _target_: src.models.backbone.resnet.ResNet
    ResBlock: src.models.backbone.resnet.BottleNeck
    layer_list: [3,4,6,3]
    num_classes: 1024
    num_channels: 3
  arcmargin: 
    _target_: src.models.backbone.ArcPalm.ArcMarginProduct
    in_features: 1024
    out_features: 167
    s: 30.0
    m: 0.50
    easy_margin: False
