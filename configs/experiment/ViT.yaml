# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: COEP_DataModule
  - override /model: ArcPalmModule
  - override /callbacks: default
  - override /trainer: gpu

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["COEP", "Vision Transform"]

logger:
  wandb:
    tags: ${tags}
    group: "COEP"
  aim:
    experiment: "COEP ViT"

model: 
  backbone: 
  _target_: src.models.backbone.ViT.SimpleViT
  image_height: 1200
  image_width: 1600
  patch_size: 40
  num_classes: 512
  dim: 1024
  depth: 4
  heads: 8
  mlp_dim: 2048
arcmargin: 
  _target_: src.models.backbone.ArcPalm.ArcMarginProduct
  in_features: 512
  out_features: 167
  s: 30.0
  m: 0.50
  easy_margin: False