# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: COEP_DataModule
  - override /model: ArcPalmModule
  - override /callbacks: default
  - override /trainer: gpu

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["COEP", "Vision Transform"]

data:
  batch_size: 64
logger:
  wandb:
    tags: ${tags}
    group: "COEP"
  aim:
    experiment: "COEP ViT"

model: 
  backbone: 
    _target_: src.models.backbone.ViT.SimpleViT
    image_height: 256
    image_width: 256
    patch_size: 32
    num_classes: 1024
    dim: 1024
    depth: 6
    heads: 16
    mlp_dim: 2048
  arcmargin: 
    _target_: src.models.backbone.ArcPalm.ArcMarginProduct
    in_features: 1024
    out_features: 96
    s: 30.0
    m: 0.50
    easy_margin: False