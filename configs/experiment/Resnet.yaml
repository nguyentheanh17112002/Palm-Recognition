# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: Full_DataModule
  - override /model: ArcPalmModule
  - override /callbacks: default
  - override /trainer: gpu
  - override /hydra: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["Thesis", "No Pretrain", "Resnet 50", "ArcFaceLoss", "Canny"]

hydra:
  run:
    dir: ${paths.log_dir}/${task_name}/runs/ThesisPalm_Resnet50_NoPretrain_ArcFaceLoss_Canny_2

data:
  type_data: 'canny'
  batch_size: 32
  num_workers: 20

trainer:
  min_epochs: 150
  max_epochs: 150
  accumulate_grad_batches: 4

logger:
  wandb:
    name: "ThesisPalm_Resnet50_NoPretrain_ArcFaceLoss_Canny_2"
    tags: ${tags}
    group: "Resnet 50"
  aim:
    experiment: "Full Resnet"

model:
  backbone:
    _target_: src.models.backbone.resnet.ResNet
    block: "Bottleneck"
    model: "resnet50"
    num_classes: 512
    num_channels: 6
  loss: 'ArcFaceLoss'
  optimizer:
    lr: 0.01
  num_classes: 1527
  # pretrain_backbone: "/home/anhnt596/Palm-Recognition/logs/train/runs/Pretrained_Resnet50_SubCenterArcFace_DataGen/checkpoints/epoch_023.ckpt"
